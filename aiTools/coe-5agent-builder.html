<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integration COE — 5-Agent Prompt Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;--s1:#0c0f1a;--s2:#111520;--s3:#171c2e;
  --border:#1c2238;--border2:#263050;--text:#cdd8f0;--muted:#4a5880;--dim:#232d48;
  --amber:#f59e0b;--amber-d:#7c4f05;--amber-g:rgba(245,158,11,.1);
  --cyan:#22d3ee;--cyan-d:#064e63;--cyan-g:rgba(34,211,238,.1);
  --violet:#a78bfa;--violet-d:#3b2570;--violet-g:rgba(167,139,250,.1);
  --green:#34d399;--green-d:#064e32;--green-g:rgba(52,211,153,.1);
  --rose:#fb7185;--rose-d:#5a1628;--rose-g:rgba(251,113,133,.1);
  --mono:'Geist Mono',monospace;--sans:'Instrument Sans',sans-serif;
  --r:7px;--rl:11px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}

/* NAV */
nav{
  height:50px;display:flex;align-items:center;justify-content:space-between;
  padding:0 1.25rem;border-bottom:1px solid var(--border);background:var(--s1);
  position:relative;z-index:60;gap:1rem;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:9px}
.brand-chip{
  padding:3px 8px;border-radius:5px;font-family:var(--mono);font-size:9px;font-weight:500;
  background:linear-gradient(135deg,var(--amber),var(--cyan));color:#000;letter-spacing:.02em
}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-.2px}
.brand-ver{font-size:10px;color:var(--muted);margin-left:6px;font-family:var(--mono)}

.key-wrap{
  display:flex;align-items:center;gap:7px;background:var(--s2);
  border:1px solid var(--border);border-radius:var(--r);padding:5px 9px;max-width:320px;flex:1
}
.key-wrap label{font-size:9px;color:var(--muted);font-family:var(--mono);white-space:nowrap;letter-spacing:.06em}
.key-wrap input{background:none;border:none;outline:none;font-family:var(--mono);font-size:11px;color:var(--text);flex:1;min-width:0}
.key-wrap input::placeholder{color:var(--dim)}
.kdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
.kdot.ok{background:var(--green)}.kdot.no{background:var(--dim)}.kdot.bad{background:var(--rose)}

/* PIPELINE ROW */
.pipe{
  height:48px;display:flex;align-items:center;gap:0;padding:0 1.25rem;
  border-bottom:1px solid var(--border);background:var(--s1);
  overflow-x:auto;flex-shrink:0;
}
.pipe::-webkit-scrollbar{height:0}
.pipe-lbl{font-size:9px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;margin-right:8px}
.ps{
  display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r);
  font-size:11px;font-weight:500;cursor:pointer;border:1px solid transparent;
  transition:all .18s;white-space:nowrap;flex-shrink:0
}
.ps:hover{background:var(--s3)}
.ps.ov{color:var(--muted)}
.ps.ov.active{background:var(--s3);border-color:var(--border2);color:var(--text)}
.ps.amber{color:var(--amber)}.ps.amber.active{background:var(--amber-g);border-color:var(--amber)}
.ps.cyan{color:var(--cyan)}.ps.cyan.active{background:var(--cyan-g);border-color:var(--cyan)}
.ps.violet{color:var(--violet)}.ps.violet.active{background:var(--violet-g);border-color:var(--violet)}
.ps.green{color:var(--green)}.ps.green.active{background:var(--green-g);border-color:var(--green)}
.ps.rose{color:var(--rose)}.ps.rose.active{background:var(--rose-g);border-color:var(--rose)}
.pa{color:var(--dim);padding:0 3px;flex-shrink:0}

/* SHELL */
.shell{display:flex;height:calc(100vh - 98px);overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:268px;flex-shrink:0;border-right:1px solid var(--border);
  background:var(--s1);display:flex;flex-direction:column;overflow:hidden
}
.sb-agents{flex-shrink:0}
.ag-tab{
  display:flex;align-items:center;gap:9px;padding:.7rem 1rem;
  border-left:3px solid transparent;cursor:pointer;transition:all .15s;
  border-bottom:1px solid var(--border)
}
.ag-tab:hover{background:var(--s2)}
.ag-tab.active.amber{background:var(--amber-g);border-left-color:var(--amber)}
.ag-tab.active.cyan{background:var(--cyan-g);border-left-color:var(--cyan)}
.ag-tab.active.violet{background:var(--violet-g);border-left-color:var(--violet)}
.ag-tab.active.green{background:var(--green-g);border-left-color:var(--green)}
.ag-tab.active.rose{background:var(--rose-g);border-left-color:var(--rose)}
.ag-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.ag-info{flex:1;min-width:0}
.ag-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-sub{font-size:9px;color:var(--muted);margin-top:1px;font-family:var(--mono)}
.ag-num{
  width:18px;height:18px;border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9px;font-weight:500
}
.amber .ag-num{background:var(--amber-d);color:var(--amber)}
.cyan .ag-num{background:var(--cyan-d);color:var(--cyan)}
.violet .ag-num{background:var(--violet-d);color:var(--violet)}
.green .ag-num{background:var(--green-d);color:var(--green)}
.rose .ag-num{background:var(--rose-d);color:var(--rose)}

.sb-detail{flex:1;overflow-y:auto;display:none}
.sb-detail.show{display:block}
.sb-sec{padding:.6rem .9rem .2rem}
.sb-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);padding-bottom:.35rem}
.field{margin-bottom:.65rem;padding:0 .1rem}
.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:3px;font-family:var(--mono)}
.field select,.field input{
  width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:var(--sans);font-size:11px;padding:5px 7px;outline:none;appearance:none;
  transition:border-color .15s
}
.field select:focus,.field input:focus{border-color:currentColor}
.field input::placeholder{color:var(--dim)}
.cmd-sec{padding:.2rem .6rem .8rem}
.cmd-item{
  padding:7px 9px;border-radius:var(--r);border:1px solid transparent;
  cursor:pointer;transition:all .13s;margin-bottom:2px
}
.cmd-item:hover{background:var(--s2);border-color:var(--border)}
.cmd-item.sel.amber{background:var(--amber-g);border-color:var(--amber)}
.cmd-item.sel.cyan{background:var(--cyan-g);border-color:var(--cyan)}
.cmd-item.sel.violet{background:var(--violet-g);border-color:var(--violet)}
.cmd-item.sel.green{background:var(--green-g);border-color:var(--green)}
.cmd-item.sel.rose{background:var(--rose-g);border-color:var(--rose)}
.cmd-name{font-family:var(--mono);font-size:10px;font-weight:500;margin-bottom:2px}
.cmd-name.amber{color:var(--amber)}.cmd-name.cyan{color:var(--cyan)}
.cmd-name.violet{color:var(--violet)}.cmd-name.green{color:var(--green)}.cmd-name.rose{color:var(--rose)}
.cmd-desc{font-size:10px;color:var(--muted);line-height:1.4}
.sdiv{height:1px;background:var(--border);margin:.3rem .6rem}

/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.pane{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.9rem;flex:1}

/* OVERVIEW */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem}
.ov-card{
  background:var(--s2);border:1px solid var(--border);border-radius:var(--rl);
  padding:.9rem;cursor:pointer;transition:all .18s;
}
.ov-card:hover{background:var(--s3);transform:translateY(-1px)}
.ov-card.amber:hover{border-color:var(--amber)}
.ov-card.cyan:hover{border-color:var(--cyan)}
.ov-card.violet:hover{border-color:var(--violet)}
.ov-card.green:hover{border-color:var(--green)}
.ov-card.rose:hover{border-color:var(--rose)}
.ov-icon{font-size:22px;margin-bottom:.5rem}
.ov-num{font-family:var(--mono);font-size:9px;margin-bottom:3px}
.ov-num.amber{color:var(--amber)}.ov-num.cyan{color:var(--cyan)}
.ov-num.violet{color:var(--violet)}.ov-num.green{color:var(--green)}.ov-num.rose{color:var(--rose)}
.ov-name{font-size:12px;font-weight:600;margin-bottom:3px}
.ov-sub{font-size:10px;color:var(--muted);line-height:1.4}
.flow-row{
  display:flex;align-items:stretch;gap:0;
  background:var(--s2);border:1px solid var(--border);border-radius:var(--rl);
  overflow:hidden;
}
.flow-ag{flex:1;padding:.75rem .9rem;border-right:1px solid var(--border)}
.flow-ag:last-child{border-right:none}
.flow-ag-name{font-size:10px;font-weight:600;margin-bottom:5px}
.flow-ag-name.amber{color:var(--amber)}.flow-ag-name.cyan{color:var(--cyan)}
.flow-ag-name.violet{color:var(--violet)}.flow-ag-name.green{color:var(--green)}.flow-ag-name.rose{color:var(--rose)}
.flow-items{font-size:9px;color:var(--muted);line-height:1.8;font-family:var(--mono)}
.flow-arr{
  display:flex;align-items:center;justify-content:center;
  padding:0 6px;color:var(--dim);font-size:14px;flex-shrink:0
}

/* AGENT PANE */
.pane-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.pane-title{font-size:15px;font-weight:600;letter-spacing:-.2px;font-family:var(--mono)}
.pane-about{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.55;max-width:520px}
.ag-badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:20px;font-size:9px;font-weight:600;border:1px solid;flex-shrink:0;font-family:var(--mono)
}
.ag-badge.amber{background:var(--amber-d);color:var(--amber);border-color:var(--amber)}
.ag-badge.cyan{background:var(--cyan-d);color:var(--cyan);border-color:var(--cyan)}
.ag-badge.violet{background:var(--violet-d);color:var(--violet);border-color:var(--violet)}
.ag-badge.green{background:var(--green-d);color:var(--green);border-color:var(--green)}
.ag-badge.rose{background:var(--rose-d);color:var(--rose);border-color:var(--rose)}

.notice{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);padding:8px 11px;font-size:11px;color:var(--muted);line-height:1.55
}
.notice strong{color:var(--text)}
.notice a{text-decoration:none}
.notice a:hover{text-decoration:underline}
.notice.amber{border-left:3px solid var(--amber)}.notice a.amber{color:var(--amber)}
.notice.cyan{border-left:3px solid var(--cyan)}.notice a.cyan{color:var(--cyan)}
.notice.violet{border-left:3px solid var(--violet)}.notice a.violet{color:var(--violet)}
.notice.green{border-left:3px solid var(--green)}.notice a.green{color:var(--green)}
.notice.rose{border-left:3px solid var(--rose)}.notice a.rose{color:var(--rose)}

.inp-row{display:flex;gap:7px;align-items:flex-start}
.prompt-in{
  flex:1;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:var(--sans);font-size:12px;padding:8px 11px;
  outline:none;resize:none;min-height:38px;max-height:100px;line-height:1.5;
  transition:border-color .15s
}
.prompt-in::placeholder{color:var(--dim)}

.btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;
  border-radius:var(--r);font-family:var(--sans);font-size:11px;font-weight:500;
  cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap
}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-ghost{background:var(--s2);color:var(--text);border-color:var(--border)}
.btn-ghost:hover:not(:disabled){border-color:var(--border2);background:var(--s3)}
.btn.amber{background:var(--amber);color:#000}.btn.amber:hover:not(:disabled){opacity:.82}
.btn.cyan{background:var(--cyan);color:#000}.btn.cyan:hover:not(:disabled){opacity:.82}
.btn.violet{background:var(--violet);color:#000}.btn.violet:hover:not(:disabled){opacity:.82}
.btn.green{background:var(--green);color:#000}.btn.green:hover:not(:disabled){opacity:.82}
.btn.rose{background:var(--rose);color:#000}.btn.rose:hover:not(:disabled){opacity:.82}

/* OUTPUT */
.out-card{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--rl);
  display:flex;flex-direction:column;flex:1;min-height:340px;overflow:hidden
}
.out-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 11px;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap
}
.out-meta{display:flex;align-items:center;gap:9px}
.mode-tag{
  font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:4px;
  border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.05em
}
.meter{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted);font-family:var(--mono)}
.mtrack{width:80px;height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.mfill{height:100%;border-radius:2px;transition:width .3s,background .3s}
.out-acts{display:flex;gap:4px}
.out-body{
  flex:1;overflow-y:auto;padding:1rem 1.25rem;
  font-family:var(--mono);font-size:11px;line-height:1.75;
  color:var(--text);white-space:pre-wrap;word-break:break-word
}
.out-body.empty{
  font-family:var(--sans);display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:var(--muted);gap:7px;font-size:11px
}
.out-body.empty svg{opacity:.15}
.stat-row{
  display:flex;align-items:center;gap:6px;padding:6px 11px;
  border-top:1px solid var(--border);font-size:9px;color:var(--muted);font-family:var(--mono)
}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.sdot.idle{background:var(--dim)}.sdot.work{background:var(--amber);animation:pulse 1s infinite}
.sdot.done{background:var(--green)}.sdot.err{background:var(--rose)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.cur{display:inline-block;width:2px;height:10px;background:currentColor;vertical-align:middle;margin-left:1px;animation:blink 1s infinite}

.toast{
  position:fixed;bottom:1rem;right:1rem;background:var(--s3);
  border:1px solid var(--border2);border-radius:var(--r);padding:8px 13px;
  font-size:11px;color:var(--text);opacity:0;transform:translateY(5px);
  transition:all .2s;pointer-events:none;z-index:999
}
.toast.show{opacity:1;transform:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<nav>
  <div class="brand">
    <div class="brand-chip">COE</div>
    <span class="brand-name">Integration COE Agent Builder</span>
    <span class="brand-ver">v2.0 · 5 agents</span>
  </div>
  <div class="key-wrap">
    <label>API KEY</label>
    <input type="password" id="apikey" placeholder="sk-ant-api03-…" oninput="onKey()" autocomplete="off">
    <div class="kdot no" id="kdot"></div>
  </div>
</nav>

<div class="pipe" id="pipe">
  <span class="pipe-lbl">Pipeline</span>
  <div class="ps ov active" onclick="showOv()">🗺 Overview</div>
  <span class="pa">›</span>
  <div class="ps amber" onclick="goAgent(1)">📋 E1 Estimator</div>
  <span class="pa">›</span>
  <div class="ps cyan" onclick="goAgent(2)">🔍 API Cataloguer</div>
  <span class="pa">›</span>
  <div class="ps violet" onclick="goAgent(3)">🏛 Solution Designer</div>
  <span class="pa">›</span>
  <div class="ps green" onclick="goAgent(4)">⚙ Migration Planner</div>
  <span class="pa">›</span>
  <div class="ps rose" onclick="goAgent(5)">📊 Delivery Tracker</div>
</div>

<div class="shell">
<aside class="sidebar">
  <div class="sb-agents" id="sb-agents"></div>
  <div class="sb-detail" id="sb-detail"></div>
</aside>
<main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── AGENT DATA ────────────────────────────────────────────────────
const AGENTS = [
  { id:1, name:'E1 Estimator', sub:'Intake & feasibility', color:'amber', icon:'📋',
    desc:'Entry point for all COE work. Takes an E1 estimation request and produces a structured recommendation covering feasibility, technology choice, reusable artefacts, technical debt, patching needs, and resourcing guidance for the tribe lead.',
    fields:[
      {id:'a1-reqid',label:'Request / CR ID',type:'input',ph:'e.g. E1-2024-0042'},
      {id:'a1-domain',label:'Business domain',type:'input',ph:'e.g. Retail Payments, Treasury'},
      {id:'a1-tribe',label:'Tribe / squad',type:'input',ph:'e.g. Platform Tribe, Squad Falcon'},
      {id:'a1-stack',label:'Current stack',type:'select',opts:['MuleSoft 3.x','MuleSoft 4.x','IBM IIB','Oracle Service Bus','TIBCO','Mixed / unknown']},
    ],
    cmds:[
      {id:'intake',name:'/e1-intake',desc:'Capture & structure the E1 request',about:'Takes a raw E1 estimation request and structures it into a consistent intake record with all fields needed for feasibility assessment and downstream agents.'},
      {id:'feasibility',name:'/e1-feasibility',desc:'API feasibility & technology recommendation',about:'Assesses feasibility of the requested integration work and produces a MuleSoft vs Spring Boot recommendation with rationale, complexity score, and effort estimate.'},
      {id:'reusability',name:'/e1-reusability',desc:'Identify reusable artefacts',about:'Scans the described scope against known COE assets and recommends reusable components, templates, and patterns — avoiding duplication across squads.'},
      {id:'techdebt',name:'/e1-tech-debt',desc:'Technical debt & patching report',about:'Identifies technical debt and version/patch gaps in the current scope and produces a prioritised remediation list with effort and risk ratings.'},
      {id:'resourcing',name:'/e1-resourcing',desc:'Squad resourcing recommendation',about:'Recommends the right skill mix for the squad based on work scope, including sourcing guidance for specialist roles and vendor resource needs.'},
      {id:'esum',name:'/e1-summary',desc:'E1 estimation summary report',about:'Consolidates all E1 findings into a structured report for the tribe lead — ready to paste into Confluence or a formal estimation template.'},
    ]
  },
  { id:2, name:'API Cataloguer', sub:'Discover → Logseq MD', color:'cyan', icon:'🔍',
    desc:'Discovery companion for new joiners or new domains. Interrogates APIs and outputs structured Logseq markdown with backlinks, dependency maps, and agent-consumable MD files that feed all downstream agents.',
    fields:[
      {id:'a2-bank',label:'Bank / domain',type:'input',ph:'e.g. Retail Banking, Treasury'},
      {id:'a2-cat',label:'API category',type:'select',opts:['Core Banking','Payments','Customer / CRM','Risk & Compliance','Reporting & Analytics','Identity & Auth','Notification & Messaging','Integration / Middleware','Unknown / To discover']},
      {id:'a2-src',label:'Source system',type:'input',ph:'e.g. MuleSoft, legacy SOAP, SAP'},
    ],
    cmds:[
      {id:'catalogue',name:'/catalogue-api',desc:'Capture a single API into Logseq MD',about:'Interrogates an API and outputs a full Logseq page with [[backlinks]], properties, endpoints, dependencies, and migration flags ready for Agent 3.'},
      {id:'deps',name:'/capture-dependencies',desc:'Map cross-API dependency graph',about:'Produces a dependency map page and migration sequencing recommendation from multiple catalogued API pages.'},
      {id:'skills',name:'/generate-skills-md',desc:'Produce SKILLS.md from catalogued APIs',about:'Synthesises catalogued API knowledge into SKILLS.md — the agentic context file that Agent 3 reads for N — Norms in the REASONS canvas.'},
      {id:'specs',name:'/generate-specs-md',desc:'Produce SPECS.md for solution design',about:'Consolidates API contracts and constraints into SPECS.md — feeds into S — Safeguards in the Agent 3 REASONS canvas.'},
      {id:'session',name:'/session-summary',desc:'End-of-session discovery recap',about:'Produces a structured recap of catalogued APIs, gaps found, open questions, and what is ready for Agent 3 Solution Designer.'},
    ]
  },
  { id:3, name:'Solution Designer', sub:'Architecture & patterns', color:'violet', icon:'🏛️',
    desc:'The architectural decision layer. Reads E1 output and Logseq MD files to produce the REASONS canvas, reusable component design, integration pattern selection, and formal technology decisions before any build begins.',
    fields:[
      {id:'a3-decision',label:'Technology decision',type:'select',opts:['MuleSoft (retain)','Spring Boot (migrate)','Hybrid (facade pattern)','New greenfield API','TBD — needs assessment']},
      {id:'a3-pattern',label:'Primary pattern',type:'select',opts:['REST API','Event-driven / async','Batch / file-based','SOAP → REST migration','API gateway / facade','Orchestration flow']},
      {id:'a3-compliance',label:'Compliance constraints',type:'input',ph:'e.g. PSD2, GDPR, FCA, SOX'},
    ],
    cmds:[
      {id:'canvas',name:'/spdd-reasons-canvas',desc:'Generate REASONS canvas from E1 + MD files',about:'Pre-populates the full REASONS canvas (R-E-A-S-O-N-S) from E1 estimation and Logseq MD files. The approved canvas governs all Agent 4 generation.'},
      {id:'reusable',name:'/design-reusable',desc:'Design reusable component specifications',about:'Produces specifications for reusable artefacts identified in E1 — shared schemas, error handlers, auth modules, logging interceptors — to prevent duplication.'},
      {id:'patterns',name:'/select-patterns',desc:'Integration pattern selection guide',about:'Evaluates and recommends integration patterns for the scope with rationale, trade-offs, and Spring Boot or MuleSoft implementation notes.'},

function goAgent(id){
  activeAg=id;
  document.querySelectorAll('[id^=pane-]').forEach(p=>p.style.display='none');
  document.getElementById('pane-'+id).style.display='flex';
  AGENTS.forEach(a=>document.getElementById('atab'+a.id).classList.remove('active'));
  document.getElementById('atab'+id).classList.add('active');
  document.querySelectorAll('.ps').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.ps')[id].classList.add('active');
  document.getElementById('sb-detail').className='sb-detail show';
  renderSidebar(id);
  // auto-select first command if none selected
  const ag=AGENTS.find(a=>a.id===id);
  if(!selCmd[id]) selectCmd(id, ag.cmds[0].id);
  updateNotice(id);
}

function selectCmd(agId, cmdId){
  selCmd[agId]=cmdId;
  const ag=AGENTS.find(a=>a.id===agId);
  const cmd=ag.cmds.find(c=>c.id===cmdId);
  document.getElementById('title-'+agId).textContent=cmd.name;
  document.getElementById('about-'+agId).textContent=cmd.about;
  renderSidebar(agId);
  const t=tpl(agId,cmdId);
  setOut(agId,t,'template');
}

function refreshTpl(agId){
  if(selCmd[agId]) setOut(agId, tpl(agId,selCmd[agId]), 'template');
}

function setOut(agId,text,mode){
  outputs[agId]=text;

  el.className='out-body'; el.textContent=text;
  document.getElementById('mtag-'+agId).textContent=mode;
  document.getElementById('cbtn-'+agId).disabled=false;
  document.getElementById('clrbtn-'+agId).disabled=false;
  updateMeter(agId,text);
  setStat(agId,'idle','Ready');
}

function updateMeter(agId,text){
  const len=text.length,pct=Math.min(len/8000*100,100);
  const ag=AGENTS.find(a=>a.id===agId);
  const f=document.getElementById('mfill-'+agId);
  f.style.width=pct+'%';
  f.style.background=pct>90?'var(--rose)':pct>75?'var(--amber)':`var(--${ag.color})`;
  document.getElementById('mchars-'+agId).textContent=len.toLocaleString()+' / 8,000';
}

function setStat(agId,state,text){
  document.getElementById('sdot-'+agId).className='sdot '+state;
  document.getElementById('stext-'+agId).textContent=text;

  navigator.clipboard.writeText(outputs[agId])
    .then(()=>toast('Copied ✓'))
    .catch(()=>{const t=document.createElement('textarea');t.value=outputs[agId];document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('Copied ✓');});
}

// ── API GENERATION ────────────────────────────────────────────────
function updateNotice(agId){
  const n=document.getElementById('notice-'+agId);
  if(n) n.style.display=apiKey.startsWith('sk-ant-')?'none':'block';
}

async function generate(agId){
  if(!apiKey||busy[agId])return;
  const ag=AGENTS.find(a=>a.id===agId);
  const cmdId=selCmd[agId];
  if(!cmdId){toast('Select a command first');return;}
  const userTxt=document.getElementById('inp-'+agId).value.trim();
  const base=tpl(agId,cmdId);

  const sys=`You are an expert prompt engineer for Microsoft Copilot agents in a bank Integration COE.
Task: Refine a Copilot agent prompt for Agent ${agId} (${ag.name}).
HARD CONSTRAINTS:
- Output ≤ 8000 characters (Copilot Studio hard limit)
- Output ONLY the prompt text — no explanations, no markdown fences, no preamble
- Preserve command structure, [[Logseq backlinks]], SPDD canvas sections, and Confluence/MD output formats
- Every instruction must be specific and actionable

Context: ${JSON.stringify(getCtx(agId))}
Base template:\n${base}`;

  const msg=userTxt?`Refine for my scenario: ${userTxt}`:`Generate an optimised version for the context provided.`;

  busy[agId]=true;
  const btn=document.getElementById('gbtn-'+agId);
  btn.disabled=true; btn.textContent='Generating…';
  setStat(agId,'work','Calling Anthropic API…');
  const el=document.getElementById('out-'+agId);
  el.className='out-body'; el.textContent=''; outputs[agId]='';
  document.getElementById('mtag-'+agId).textContent='generating…';
  document.getElementById('cbtn-'+agId).disabled=true;
  const cur=document.createElement('span');
  cur.className='cur'; cur.style.background=`var(--${ag.color})`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2048,stream:true,
        system:sys,messages:[{role:'user',content:msg}]})
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`);}
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const ln of lines){
        if(!ln.startsWith('data: '))continue;
        const d=ln.slice(6).trim();
        if(d==='[DONE]')continue;
        try{
          const ev=JSON.parse(d);
          if(ev.type==='content_block_delta'&&ev.delta?.type==='text_delta'){
            outputs[agId]+=ev.delta.text;
            el.textContent=outputs[agId];
            el.appendChild(cur);
            updateMeter(agId,outputs[agId]);
            el.scrollTop=el.scrollHeight;
          }
        }catch{}
      }
    }
    cur.remove();
    document.getElementById('cbtn-'+agId).disabled=false;
    document.getElementById('mtag-'+agId).textContent='ai-generated';
    setStat(agId,'done',`Done — ${outputs[agId].length.toLocaleString()} chars`);
  }catch(err){
    cur.remove();
    el.textContent=`Error: ${err.message}\n\nIf on a corporate network, api.anthropic.com may be blocked.\nThe template prompts above are still available to copy without an API key.`;
    setStat(agId,'err','API error — templates still available');
    document.getElementById('kdot').className='kdot bad';
    document.getElementById('mtag-'+agId).textContent='error';
  }finally{
    busy[agId]=false;
    btn.disabled=!apiKey.startsWith('sk-ant-');
    btn.innerHTML=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Generate`;
  }
}

// ── API KEY ───────────────────────────────────────────────────────
function onKey(){
  apiKey=document.getElementById('apikey').value.trim();
  const ok=apiKey.startsWith('sk-ant-');
  document.getElementById('kdot').className='kdot '+(apiKey.length===0?'no':ok?'ok':'bad');
  [1,2,3,4,5].forEach(i=>{
    const b=document.getElementById('gbtn-'+i);
    if(b) b.disabled=!ok;
    updateNotice(i);
  });
}

function resize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&activeAg>0) generate(activeAg);
});

// ── BOOT ─────────────────────────────────────────────────────────
renderAll();
showOv();
</script>
