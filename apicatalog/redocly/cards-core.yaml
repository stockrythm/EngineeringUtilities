openapi: 3.1.0

info:
  title: Cards Core API
  version: 1.3.0
  description: |
    Core card management service for the Cards Tribe. Handles card issuance,
    lifecycle management, and transaction history.

    ## Authentication

    All endpoints require a valid OAuth 2.0 bearer token issued by the
    **Integration CoE OAuth Token Service**. See that spec for how to obtain one.

    ```
    Authorization: Bearer <token from Integration CoE>
    ```

    Required scopes per operation are documented on each endpoint.

    ## Service dependencies

    ```
    Integration CoE OAuth Token Service  →  token validation (all requests)
    Payments Core API                    →  payment status checks for transaction history
    ```

    ## Payments integration

    Transaction history (`GET /cards/{cardId}/transactions`) enriches each
    transaction record with the latest payment status by calling
    **Payments Core API** (`GET /payments/{id}`). If Payments API is
    unavailable, transactions are returned without enrichment — the raw
    transaction data is never blocked.

  contact:
    name: Cards Tribe
    email: cards-tribe@company.com
    url: https://wiki.company.com/cards-tribe

  # ── Operational Metadata ──────────────────────────────────────────────────
  x-owning-team: Cards Tribe
  x-owning-tribe: cards
  x-slack-channel: "#cards-api-support"
  x-runbook: https://wiki.company.com/cards-tribe/cards-core-runbook
  x-on-call: https://pagerduty.company.com/service/cards-tribe

  x-service-tier: 1
  x-sla:
    availability: "99.95%"
    response-time-p99: "250ms"
  x-rpo-minutes: 15
  x-rto-minutes: 30

  x-upstream-services:
    - name: Integration CoE OAuth Token Service
      tribe: integration-coe
      spec: ../../../apis/integration-coe/oauth-token/openapi.yaml
      criticality: required
      purpose: Token validation on every inbound request
    - name: Payments Core API
      tribe: payments
      spec: ../../../apis/payments/payments-core/openapi.yaml
      criticality: degraded-without
      purpose: Payment status enrichment in transaction history

  x-downstream-consumers:
    - name: Payments Core API
      tribe: payments
      contact: payments-tribe@company.com
      purpose: Card status verification during payment initiation

  x-metadata-enabled: true

servers:
  - url: https://api.internal.company.com/cards/v1
    description: Production
  - url: https://api.sandbox.company.com/cards/v1
    description: Sandbox

security:
  - OAuth2ClientCredentials: []

tags:
  - name: Cards
    description: Issue and manage cards
  - name: Transactions
    description: Card transaction history

paths:

  /cards:
    post:
      operationId: issueCard
      tags: [Cards]
      summary: Issue a new card
      description: |
        Issues a new virtual or physical card and returns the card record.
        Physical cards are dispatched within 3–5 business days.

        **Required scope:** `cards:write`
      security:
        - OAuth2ClientCredentials: [cards:write]
      parameters:
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/HeaderTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCardRequest'
            examples:
              virtual:
                summary: Issue a virtual card
                value:
                  type: VIRTUAL
                  accountId: acc_4mKzPqRx
                  spendLimit: { amount: 50000, currency: GBP }
                  label: "Marketing expenses"
              physical:
                summary: Issue a physical card
                value:
                  type: PHYSICAL
                  accountId: acc_4mKzPqRx
                  spendLimit: { amount: 200000, currency: GBP }
                  label: "Company card"
                  deliveryAddress:
                    line1: "123 Finance Street"
                    city: "London"
                    postcode: "EC2V 8RT"
                    countryCode: "GB"
      responses:
        '201':
          description: Card issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '../../catalog/shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Forbidden'
        '422':
          description: Business rule violation (e.g. account not eligible)
          content:
            application/json:
              schema:
                $ref: '../../catalog/shared/components.yaml#/components/schemas/ErrorResponse'
        '500':
          $ref: '../../catalog/shared/components.yaml#/components/responses/InternalServerError'

    get:
      operationId: listCards
      tags: [Cards]
      summary: List cards
      description: |
        Returns a paginated list of cards. Filterable by status and account.

        **Required scope:** `cards:read`
      security:
        - OAuth2ClientCredentials: [cards:read]
      parameters:
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/QueryPage'
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/QueryPageSize'
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/HeaderTraceId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CardStatus'
          description: Filter by card status
        - name: accountId
          in: query
          schema:
            type: string
          description: Filter cards by account
          example: acc_4mKzPqRx
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CardType'
          description: Filter by card type
      responses:
        '200':
          description: Paginated list of cards
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  meta:
                    $ref: '../../catalog/shared/components.yaml#/components/schemas/PaginationMeta'
        '400':
          $ref: '../../catalog/shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Forbidden'
        '500':
          $ref: '../../catalog/shared/components.yaml#/components/responses/InternalServerError'

  /cards/{cardId}:
    get:
      operationId: getCard
      tags: [Cards]
      summary: Get a card by ID
      description: |
        Returns the current state of a single card, including its status
        and spend limit.

        **Required scope:** `cards:read`

        > **Called by Payments Core API** to check card status before
        > processing a card payment. Payments requests this endpoint with
        > scope `cards:read`.
      security:
        - OAuth2ClientCredentials: [cards:read]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
          description: Card ID
          example: card_9kQ2mNpX
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/HeaderTraceId'
      responses:
        '200':
          description: Card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../catalog/shared/components.yaml#/components/responses/NotFound'
        '500':
          $ref: '../../catalog/shared/components.yaml#/components/responses/InternalServerError'

  /cards/{cardId}/status:
    patch:
      operationId: updateCardStatus
      tags: [Cards]
      summary: Update card status (freeze / unfreeze / cancel)
      description: |
        Transitions a card's status. Allowed transitions:

        | Current | → New | Description |
        |---|---|---|
        | ACTIVE | FROZEN | Temporarily block the card |
        | FROZEN | ACTIVE | Unfreeze the card |
        | ACTIVE, FROZEN | CANCELLED | Permanently cancel (irreversible) |

        **Required scope:** `cards:write`
      security:
        - OAuth2ClientCredentials: [cards:write]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
          example: card_9kQ2mNpX
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/HeaderTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/CardStatus'
                reason:
                  type: string
                  maxLength: 255
                  description: Optional reason (required when cancelling)
      responses:
        '200':
          description: Card status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '../../catalog/shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../catalog/shared/components.yaml#/components/responses/NotFound'
        '422':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '../../catalog/shared/components.yaml#/components/schemas/ErrorResponse'
        '500':
          $ref: '../../catalog/shared/components.yaml#/components/responses/InternalServerError'

  /cards/{cardId}/transactions:
    get:
      operationId: listCardTransactions
      tags: [Transactions]
      summary: List transactions for a card
      description: |
        Returns a paginated, date-ordered list of transactions on a card.
        Each transaction is enriched with the linked payment status from
        **Payments Core API** where available.

        If Payments API is unreachable, `paymentStatus` will be `null` —
        the transaction list itself is never blocked.

        **Required scope:** `cards:read`
      security:
        - OAuth2ClientCredentials: [cards:read]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
          example: card_9kQ2mNpX
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/QueryPage'
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/QueryPageSize'
        - $ref: '../../catalog/shared/components.yaml#/components/parameters/HeaderTraceId'
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Transactions on or after this date
          example: "2024-11-01"
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Transactions on or before this date
          example: "2024-11-30"
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '../../catalog/shared/components.yaml#/components/schemas/PaginationMeta'
        '400':
          $ref: '../../catalog/shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '../../catalog/shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../catalog/shared/components.yaml#/components/responses/NotFound'
        '500':
          $ref: '../../catalog/shared/components.yaml#/components/responses/InternalServerError'

components:

  securitySchemes:
    OAuth2ClientCredentials:
      $ref: '../../catalog/shared/components.yaml#/components/securitySchemes/OAuth2ClientCredentials'

  schemas:

    CardStatus:
      type: string
      enum: [PENDING_ACTIVATION, ACTIVE, FROZEN, CANCELLED, EXPIRED]
      description: |
        - `PENDING_ACTIVATION` — physical card dispatched, awaiting activation
        - `ACTIVE` — card is live and can be used for payments
        - `FROZEN` — temporarily blocked; no new transactions
        - `CANCELLED` — permanently deactivated
        - `EXPIRED` — past expiry date

    CardType:
      type: string
      enum: [VIRTUAL, PHYSICAL]

    Card:
      type: object
      required: [id, type, status, accountId, last4, expiryMonth, expiryYear]
      properties:
        id:
          type: string
          example: card_9kQ2mNpX
        type:
          $ref: '#/components/schemas/CardType'
        status:
          $ref: '#/components/schemas/CardStatus'
        accountId:
          type: string
          example: acc_4mKzPqRx
        last4:
          type: string
          description: Last 4 digits of the card number
          example: "4242"
        expiryMonth:
          type: integer
          minimum: 1
          maximum: 12
          example: 11
        expiryYear:
          type: integer
          example: 2027
        label:
          type: string
          description: Human-readable card label
          example: "Marketing expenses"
        spendLimit:
          $ref: '../../catalog/shared/components.yaml#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
          example: "2024-11-15T09:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-11-15T10:45:00Z"

    IssueCardRequest:
      type: object
      required: [type, accountId]
      properties:
        type:
          $ref: '#/components/schemas/CardType'
        accountId:
          type: string
          example: acc_4mKzPqRx
        spendLimit:
          $ref: '../../catalog/shared/components.yaml#/components/schemas/Money'
        label:
          type: string
          maxLength: 100
          example: "Marketing expenses"
        deliveryAddress:
          $ref: '#/components/schemas/Address'
          description: Required for PHYSICAL cards

    Address:
      type: object
      required: [line1, city, postcode, countryCode]
      properties:
        line1:
          type: string
          example: "123 Finance Street"
        line2:
          type: string
          example: "Floor 4"
        city:
          type: string
          example: "London"
        postcode:
          type: string
          example: "EC2V 8RT"
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2
          example: "GB"

    Transaction:
      type: object
      required: [id, cardId, amount, merchantName, status, transactedAt]
      properties:
        id:
          type: string
          example: txn_5hJ8wVkZ
        cardId:
          type: string
          example: card_9kQ2mNpX
        amount:
          $ref: '../../catalog/shared/components.yaml#/components/schemas/Money'
        merchantName:
          type: string
          example: "Acme Supplies Ltd"
        merchantCategory:
          type: string
          description: MCC code description
          example: "Business Services"
        status:
          type: string
          enum: [AUTHORISED, SETTLED, DECLINED, REVERSED]
        paymentId:
          type: string
          description: Linked payment ID in Payments Core API (if settled)
          example: pay_9kQ2mNpX
        paymentStatus:
          type: string
          nullable: true
          description: >
            Payment status fetched from Payments Core API. Null if Payments
            API was unavailable at time of request.
          example: COMPLETED
        transactedAt:
          type: string
          format: date-time
          example: "2024-11-15T14:22:00Z"
        settledAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-11-16T02:00:00Z"
